<section class="admin-login" aria-labelledby="login-form-title">
	<button class="back-button" type="button" aria-label="Back to login options" (click)="goBackToLoginOptions()">
		<span aria-hidden="true">&larr;</span>
		Back
	</button>

	<div class="admin-login__header">
		<span class="admin-login__eyebrow">{{ userGreeting }} portal</span>
		<h1 id="login-form-title">Hi {{ userGreeting }}</h1>
		<p>Welcome to Bharat Desk</p>
	</div>

	<form class="admin-login__form">
		<div class="form-field">
			<label for="admin-username">Email/Username</label>
			<input id="admin-username" name="username" type="text" autocomplete="username" placeholder="Enter your email or username" required />
		</div>

		<div class="form-field">
			<label for="admin-password">Password</label>
			<input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
		</div>

		<button class="google-button" type="button">
			<span class="google-mark" aria-hidden="true">G</span>
			Login with Google
		</button>

		<div class="divider" aria-hidden="true"><span>or</span></div>

		<button class="login-button" type="submit">Login</button>
		<p class="signup-prompt">
			Don't have an account?
			<a routerLink="/register">Sign up</a>
		</p>
	</form>
</section>
